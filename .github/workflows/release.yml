name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  artifact-metadata: write
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY_PEM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Validate release tag and repository version
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run release:ref:validate -- --release-name "${GITHUB_REF_NAME}"
      - run: npm ci
      - run: npm run ci
      - run: npm run release:package
      - name: Sign release checksums
        if: env.RELEASE_SIGNING_PRIVATE_KEY_PEM != ''
        run: npm run release:sign -- --checksums dist/release/SHA256SUMS --signature dist/release/SHA256SUMS.sig --public-key-out dist/release/SHA256SUMS.pub
      - name: Attest release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: "dist/release/*"
      - name: Upload release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            dist/release/forward-kentik-*.tgz
            dist/release/forward-kentik-release-manifest.json
            dist/release/forward-kentik-sbom.cdx.json
            dist/release/SHA256SUMS
          )
          if [ -f dist/release/SHA256SUMS.sig ]; then
            assets+=(dist/release/SHA256SUMS.sig)
          fi
          if [ -f dist/release/SHA256SUMS.pub ]; then
            assets+=(dist/release/SHA256SUMS.pub)
          fi
          release_args=()
          if [[ "${GITHUB_REF_NAME}" == v0.* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file docs/release-notes.md \
            "${release_args[@]}" \
            "${assets[@]}"
